<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
</head>
<body>
    <h1>registro</h1>
    <form action="/registro" method="POST">
        <label for="">Nombre(s):</label>
        <input type="text" name="nombre" required>
        <br><br>
        <label for="">Apellido paterno:</label>
        <input type="text" name="apellido_p" required>
        <br><br>
        <label for="">Apellido materno:</label>
        <input type="text" name="apellido_m" required>
        <br><br>
        <label for="">Correo:</label>
        <input type="text" name="correo" required>
        <br><br>
        <label for="">Contraseña:</label>
        <input type="password" name="password_hash" required>
        <br><br>
        <label for="id_rol">Tipo de usuario</label>
        <select name="id_rol" id="id_rol" required>
            <option value="1">Administrador</option>
            <option value="2">usuario</option>
        </select>
        <button type="submit">Registrate</button>
    </form>
    <p><a href="{{url_for('home')}}">iniciar sesion</a></p>
</body>
</html>
